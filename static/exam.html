<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Online Exam</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container">

    <div class="card exam-card">

        <h1>Online Examination</h1>

        <div id="studentInfo"></div>

        <hr>


        <div id="examQuestions">

            <p class="loading">
                Loading questions...
            </p>

        </div>


        <button
            onclick="submitExam()"
            class="btn submit-btn"
        >
            Submit Exam
        </button>


        <div
            id="examMessage"
            class="message"
        ></div>

    </div>

</div>


<script src="/static/script.js"></script>

</body>

</html>
